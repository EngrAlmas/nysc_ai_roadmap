<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Engineering Roadmap PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
      --primary: #3b82f6; --success: #10b981; --border: #334155;
      --input-bg: #0f172a; --toggle-bg: #334155; --shadow: rgba(0,0,0,0.4);
    }
    body.light-mode {
      --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --primary: #2563eb; --success: #16a34a; --border: #cbd5e1;
      --input-bg: #f1f5f9; --toggle-bg: #e2e8f0; --shadow: rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1rem; max-width: 900px; margin: 0 auto; transition: background 0.3s, color 0.3s; }
    header { text-align: center; margin-bottom: 1.5rem; }
    .controls { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; justify-content: center; }
    button { background: var(--primary); color: white; border: none; padding: 0.6rem 1rem; border-radius: 0.4rem; cursor: pointer; font-weight: 500; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    #themeToggle { background: var(--toggle-bg); color: var(--text); border: 1px solid var(--border); }
    .progress-wrapper { margin: 1rem 0; }
    .progress-bar-bg { background: var(--card); border-radius: 0.5rem; height: 0.6rem; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
    .phase-section { margin: 2rem 0; padding: 1rem; background: var(--card); border-radius: 0.6rem; box-shadow: 0 2px 6px var(--shadow); }
    .phase-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .phase-title { font-size: 1.2rem; font-weight: 600; }
    .phase-goal { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .task-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .task-card { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem 1rem; align-items: center; padding: 0.8rem; background: var(--bg); border-radius: 0.4rem; border: 1px solid var(--border); transition: all 0.2s; }
    .task-card.completed { opacity: 0.7; }
    .task-check { width: 1.2rem; height: 1.2rem; accent-color: var(--success); cursor: pointer; }
    .task-info { display: flex; flex-direction: column; gap: 0.3rem; }
    .task-title { font-weight: 500; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; font-size: 0.85rem; color: var(--muted); }
    .task-meta input { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 0.3rem 0.5rem; border-radius: 0.3rem; font-size: 0.85rem; }
    .yt-link { color: #ef4444; text-decoration: none; font-weight: 500; }
    .yt-link:hover { text-decoration: underline; }
    @media (max-width: 600px) {
      .task-meta { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
      .phase-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Engineering Roadmap & Task Planner</h1>
    <p>NYSC PPA Preparation Tracker</p>
  </header>

  <div class="progress-wrapper">
    <div style="display:flex; justify-content:space-between;">
      <span>Overall Progress</span>
      <span id="overallPct">0%</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-fill" id="overallBar"></div></div>
  </div>

  <div class="controls">
    <button id="themeToggle">🌙 Light Mode</button>
    <button id="exportCSV">📥 Export CSV</button>
    <button id="resetProgress" style="background:#f59e0b;">🔄 Reset Progress</button>
  </div>

  <div id="phasesContainer"></div>

  <script>
    // 📦 Data Structure matching your PDF exactly
    const defaultRoadmap = [
      { phase: "PHASE 1 — APIs, JSON & Requests", goal: "Learn how AI apps communicate with APIs.", tasks: [
        { id: "1.1", title: "REST APIs", youtube: "https://www.youtube.com/results?search_query=Corey+Schafer+REST+API+Python+Tutorial" },
        { id: "1.2", title: "JSON", youtube: "https://www.youtube.com/results?search_query=Corey+Schafer+REST+API+Python+Tutorial" },
        { id: "1.3", title: "GET/POST requests", youtube: "https://www.youtube.com/results?search_query=Tech+With+Tim+Python+Requests+Tutorial" },
        { id: "1.4", title: "Headers & payloads", youtube: "https://www.youtube.com/results?search_query=Tech+With+Tim+Python+Requests+Tutorial" }
      ]},
      { phase: "PHASE 2 — OpenAI APIs & Chatbots", goal: "Learn to build AI chatbot systems.", tasks: [
        { id: "2.1", title: "OpenAI APIs", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+OpenAI+API+Crash+Course" },
        { id: "2.2", title: "Prompt engineering", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+OpenAI+API+Crash+Course" },
        { id: "2.3", title: "Chat completions", youtube: "https://www.youtube.com/results?search_query=Nicholas+Renotte+AI+Chatbot+Python" },
        { id: "2.4", title: "Memory chatbots", youtube: "https://www.youtube.com/results?search_query=Nicholas+Renotte+AI+Chatbot+Python" }
      ]},
      { phase: "PHASE 3 — Streamlit & FastAPI", goal: "Build AI interfaces and backend APIs.", tasks: [
        { id: "3.1", title: "Streamlit UI", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+Streamlit+Tutorial" },
        { id: "3.2", title: "FastAPI", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+FastAPI+Full+Course" },
        { id: "3.3", title: "POST requests", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+FastAPI+Full+Course" },
        { id: "3.4", title: "Dashboards", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+Streamlit+Tutorial" }
      ]},
      { phase: "PHASE 4 — LangChain", goal: "Understand LLM orchestration systems.", tasks: [
        { id: "4.1", title: "Prompt templates", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+LangChain+Crash+Course" },
        { id: "4.2", title: "Chains", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+LangChain+Crash+Course" },
        { id: "4.3", title: "Memory", youtube: "https://www.youtube.com/results?search_query=Krish+Naik+LangChain+Course" },
        { id: "4.4", title: "Document loaders", youtube: "https://www.youtube.com/results?search_query=Krish+Naik+LangChain+Course" },
        { id: "4.5", title: "Tool calling", youtube: "https://www.youtube.com/results?search_query=Krish+Naik+LangChain+Course" }
      ]},
      { phase: "PHASE 5 — Embeddings, Vector DBs & RAG", goal: "Learn retrieval-based AI systems.", tasks: [
        { id: "5.1", title: "Embeddings", youtube: "https://www.youtube.com/results?search_query=AssemblyAI+Embeddings+Explained" },
        { id: "5.2", title: "ChromaDB", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+RAG+Tutorial+LangChain" },
        { id: "5.3", title: "FAISS", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+RAG+Tutorial+LangChain" },
        { id: "5.4", title: "RAG", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+RAG+Tutorial+LangChain" },
        { id: "5.5", title: "PDF chatbots", youtube: "https://www.youtube.com/results?search_query=freeCodeCamp+RAG+Tutorial+LangChain" }
      ]},
      { phase: "PHASE 6 — Speech-to-Text", goal: "Learn AI audio transcription systems.", tasks: [
        { id: "6.1", title: "Whisper", youtube: "https://www.youtube.com/results?search_query=AssemblyAI+Whisper+Tutorial" },
        { id: "6.2", title: "Audio processing", youtube: "https://www.youtube.com/results?search_query=AssemblyAI+Whisper+Tutorial" },
        { id: "6.3", title: "Speech transcription", youtube: "https://www.youtube.com/results?search_query=AssemblyAI+Whisper+Tutorial" }
      ]},
      { phase: "PHASE 7 — Text-to-Speech", goal: "Learn AI voice generation systems.", tasks: [
        { id: "7.1", title: "ElevenLabs", youtube: "https://www.youtube.com/results?search_query=AI+Jason+ElevenLabs+API+Tutorial" },
        { id: "7.2", title: "OpenAI TTS", youtube: "https://www.youtube.com/results?search_query=AI+Jason+ElevenLabs+API+Tutorial" },
        { id: "7.3", title: "Voice generation", youtube: "https://www.youtube.com/results?search_query=AI+Jason+ElevenLabs+API+Tutorial" }
      ]},
      { phase: "PHASE 8 — AI Agents & n8n", goal: "Learn workflow automation and AI agents.", tasks: [
        { id: "8.1", title: "n8n", youtube: "https://www.youtube.com/results?search_query=AI+Jason+n8n+Tutorial" },
        { id: "8.2", title: "Webhooks", youtube: "https://www.youtube.com/results?search_query=Cole+Medin+AI+Agents+n8n" },
        { id: "8.3", title: "Automation", youtube: "https://www.youtube.com/results?search_query=Cole+Medin+AI+Agents+n8n" },
        { id: "8.4", title: "AI workflows", youtube: "https://www.youtube.com/results?search_query=Cole+Medin+AI+Agents+n8n" }
      ]}
    ];

    const STORAGE_KEY = 'ai_roadmap_tasks';
    const THEME_KEY = 'theme-preference';
    let roadmap = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultRoadmap));

    // 🌗 Theme Logic
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
      document.body.classList.toggle('light-mode', theme === 'light');
      themeToggle.textContent = theme === 'light' ? '☀️ Dark Mode' : '🌙 Light Mode';
    }
    const savedTheme = localStorage.getItem(THEME_KEY);
    applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
    themeToggle.addEventListener('click', () => {
      const next = document.body.classList.contains('light-mode') ? 'dark' : 'light';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    // 📊 Render & Logic
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(roadmap)); updateProgress(); }
    function updateProgress() {
      const total = roadmap.reduce((sum, p) => sum + p.tasks.length, 0);
      const completed = roadmap.reduce((sum, p) => sum + p.tasks.filter(t => t.completed).length, 0);
      const pct = total ? Math.round((completed / total) * 100) : 0;
      document.getElementById('overallBar').style.width = `${pct}%`;
      document.getElementById('overallPct').textContent = `${pct}% Complete`;
      document.querySelectorAll('.phase-progress').forEach((bar, i) => {
        const p = roadmap[i];
        const pp = p.tasks.length ? Math.round((p.tasks.filter(t => t.completed).length / p.tasks.length) * 100) : 0;
        bar.style.width = `${pp}%`;
        bar.parentElement.nextElementSibling.textContent = `${pp}%`;
      });
    }

    function render() {
      const container = document.getElementById('phasesContainer');
      container.innerHTML = '';
      roadmap.forEach((phase, idx) => {
        const section = document.createElement('div');
        section.className = 'phase-section';
        section.innerHTML = `
          <div class="phase-header">
            <span class="phase-title">${phase.phase}</span>
            <span style="font-size:0.85rem; color:var(--muted)">${phase.goal}</span>
          </div>
          <div class="progress-wrapper">
            <div style="display:flex; justify-content:space-between;">
              <span>Phase Progress</span>
              <span>${phase.tasks.filter(t=>t.completed).length}/${phase.tasks.length}</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-fill phase-progress" style="width:0%"></div></div>
          </div>
          <div class="task-list"></div>
        `;
        const list = section.querySelector('.task-list');
        phase.tasks.forEach(task => {
          const card = document.createElement('div');
          card.className = `task-card ${task.completed ? 'completed' : ''}`;
          card.innerHTML = `
            <input type="checkbox" class="task-check" data-phase="${idx}" data-id="${task.id}" ${task.completed ? 'checked' : ''}>
            <div class="task-info">
              <div class="task-title">${task.title}</div>
              <div class="task-meta">
                <a href="${task.youtube}" target="_blank" class="yt-link">📺 YouTube Tutorial</a>
                <label>Start: <input type="datetime-local" value="${task.startDate || ''}" data-phase="${idx}" data-id="${task.id}" data-field="startDate"></label>
                <label>Finish: <input type="datetime-local" value="${task.finishDate || ''}" data-phase="${idx}" data-id="${task.id}" data-field="finishDate"></label>
              </div>
            </div>
          `;
          list.appendChild(card);
        });
        container.appendChild(section);
      });
      updateProgress();
    }

    // Event Delegation
    document.getElementById('phasesContainer').addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        const { phase, id } = e.target.dataset;
        roadmap[phase].tasks.find(t => t.id === id).completed = e.target.checked;
        save(); render();
      } else if (e.target.type === 'datetime-local') {
        const { phase, id, field } = e.target.dataset;
        roadmap[phase].tasks.find(t => t.id === id)[field] = e.target.value;
        save();
      }
    });

    document.getElementById('exportCSV').addEventListener('click', () => {
      let csv = 'Phase,Task,YouTube Link,Start Date,Finish Date,Completed\n';
      roadmap.forEach(p => {
        p.tasks.forEach(t => {
          csv += `"${p.phase}","${t.title}","${t.youtube}","${t.startDate || ''}","${t.finishDate || ''}","${t.completed ? 'Yes' : 'No'}"\n`;
        });
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
      a.download = 'ai_engineering_roadmap_progress.csv';
      a.click();
    });

    document.getElementById('resetProgress').addEventListener('click', () => {
      if (confirm('Reset all dates & completion status? (Phase structure remains)')) {
        roadmap.forEach(p => p.tasks.forEach(t => { t.completed = false; t.startDate = ''; t.finishDate = ''; }));
        save(); render();
      }
    });

    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
